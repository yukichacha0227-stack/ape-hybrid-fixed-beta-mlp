[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-hybrid"
version = "1.0.0"
description = "Fixed-beta Ridge plus residual MLP and affine calibration for APE prediction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yuki Kasai"}]
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
